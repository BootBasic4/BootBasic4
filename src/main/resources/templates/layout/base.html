<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        페이지별 title 오버라이드 방법:
        자식 페이지 <head> 안에 아래처럼 쓰면 해당 페이지 title로 교체됨
            <title>질문 목록 - Q&A 커뮤니티</title>
    -->
    <title>Q&A 커뮤니티</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- 공통 커스텀 CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <!-- 페이지별 추가 CSS 삽입 지점 (필요한 페이지에서만 사용) -->
    <th:block layout:fragment="css"></th:block>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<!-- 상단 네비게이션 (navbar.html에서 가져옴) -->
<th:block th:replace="~{layout/navbar :: navbar}"></th:block>

<!-- 메인 콘텐츠 영역 -->
<main class="flex-grow-1 py-4">
    <div class="container">
        <!--
            ★ 팀원들이 만든 각 페이지는 아래 fragment를 채운다 ★

            자식 페이지 상단에 이 두 줄 추가:
                xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
                layout:decorate="~{layout/base}"

            그리고 본문을 아래 태그로 감싸면 끝:
                <th:block layout:fragment="content">
                    ... 페이지 고유 내용 ...
                </th:block>
        -->
        <th:block layout:fragment="content"></th:block>
    </div>
</main>

<!-- 하단 푸터 (footer.html에서 가져옴) -->
<th:block th:replace="~{layout/footer :: footer}"></th:block>

<!-- Bootstrap 5 JS (Popper.js 포함 번들) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 페이지별 추가 JS 삽입 지점 (필요한 페이지에서만 사용) -->
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
