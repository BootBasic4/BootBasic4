<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div style="width: 100%; max-width: 350px;">

        <h1 class="text-center fw-bold mb-5">회원가입</h1>

        <form th:action="@{/signup}" method="post" th:object="${memberFormDto}" onsubmit="return validateSignupForm()">

            <!-- 아이디 -->
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">아이디</label>

                <div class="d-flex gap-2">
                    <input type="text"
                           class="form-control"
                           id="username"
                           name="username"
                           placeholder="아이디 입력"
                           style="height:42px;"
                           oninput="resetUsernameCheck(); validateUsername()">

                    <button type="button"
                            class="btn btn-sm fw-semibold rounded-3"
                            style="width:92px; height:42px; background-color:#e9ecef; border:none; font-size:14px;"
                            onclick="checkUsername()">
                        중복확인
                    </button>
                </div>

                <div id="usernameRuleText" class="small mt-1"></div>
                <div id="usernameCheckResult" class="small mt-1"></div>
            </div>

            <!-- 비밀번호 -->
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">비밀번호</label>

                <div class="input-group">
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="form-control rounded-start-3 py-2"
                           placeholder="비밀번호를 입력하세요"
                           onfocus="showPasswordRuleBox()"
                           oninput="validatePassword()"
                           required>

                    <button type="button"
                            class="btn rounded-end-3"
                            style="width:48px; background-color:#e9ecef; border:1px solid #dee2e6;"
                            onclick="togglePassword('password', this)">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>

                <!-- 비밀번호 조건 -->
                <div id="passwordRuleBox"
                     class="small mt-3 p-3 rounded-3 border bg-white"
                     style="display:none;">

                    <div id="rule-combination" class="text-danger mb-1">
                        ✗ 영문/숫자/특수문자 중 2가지 이상 포함
                    </div>

                    <div id="rule-length" class="text-danger mb-1">
                        ✗ 8자 이상 16자 이하 입력 (공백 제외)
                    </div>

                    <div id="rule-repeat" class="text-danger">
                        ✗ 연속 3자 이상 동일한 문자/숫자 제외
                    </div>
                </div>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label fw-semibold">비밀번호 확인</label>

                <div class="input-group">
                    <input type="password"
                           id="confirmPassword"
                           th:field="*{confirmPassword}"
                           class="form-control rounded-start-3 py-2"
                           placeholder="비밀번호를 다시 입력하세요"
                           oninput="checkPasswordMatch()"
                           required>

                    <button type="button"
                            class="btn rounded-end-3"
                            style="width:48px; background-color:#e9ecef; border:1px solid #dee2e6;"
                            onclick="togglePassword('confirmPassword', this)">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>

                <div id="passwordCheckResult" class="small mt-1"></div>
            </div>

            <!-- 닉네임 -->
            <div class="mb-3">
                <label for="nickname" class="form-label fw-semibold">닉네임</label>

                <div class="d-flex gap-2">
                    <input type="text"
                           class="form-control"
                           id="nickname"
                           name="nickname"
                           placeholder="닉네임 입력"
                           style="height:42px;"
                           oninput="resetNicknameCheck(); validateNickname()">

                    <button type="button"
                            class="btn btn-sm fw-semibold rounded-3"
                            style="width:92px; height:42px; background-color:#e9ecef; border:none; font-size:14px;"
                            onclick="checkNickname()">
                        중복확인
                    </button>
                </div>

                <div id="nicknameRuleText" class="small mt-1"></div>
                <div id="nicknameCheckResult" class="small mt-1"></div>
            </div>

            <!-- 이메일 -->
            <div class="mb-3">

                <label for="emailId"
                       class="form-label fw-semibold">
                    이메일
                </label>

                <!-- 이메일 입력 -->
                <div class="d-flex gap-2 align-items-center">

                    <input type="text"
                           id="emailId"
                           class="form-control rounded-3 py-2"
                           style="flex:1;"
                           placeholder="이메일 아이디"
                           oninput="validateEmailId(); makeEmail(); resetEmailCheck()"
                           required>

                    <span>@</span>

                    <select id="emailDomain"
                            class="form-select rounded-3 py-2"
                            style="width:140px;"
                            onchange="validateEmailId(); makeEmail(); resetEmailCheck()"
                            required>

                        <option value="">선택</option>
                        <option value="naver.com">naver.com</option>
                        <option value="gmail.com">gmail.com</option>
                        <option value="daum.net">daum.net</option>
                        <option value="kakao.com">kakao.com</option>
                        <option value="nate.com">nate.com</option>

                    </select>

                </div>

                <button type="button"
                        class="btn btn-sm fw-semibold rounded-3 px-2 mt-2"
                        style="width:82px; background-color:#e9ecef; border:none; font-size:14px;"
                        onclick="checkEmail()">
                    중복확인
                </button>

                <!-- 실제 서버 전송용 -->
                <input type="hidden"
                       id="email"
                       th:field="*{email}">

                <div id="emailIdResult"
                     class="small mt-1"></div>

                <div id="emailCheckResult"
                     class="small mt-1"></div>

            </div>

            <!-- 반려동물 종류 -->
            <div class="mb-3">
                <label for="petType" class="form-label fw-semibold">반려동물 종류</label>

                <select id="petType"
                        th:field="*{petType}"
                        class="form-select rounded-3 py-2">
                    <option value="">선택 안함</option>
                    <option value="강아지">강아지</option>
                    <option value="고양이">고양이</option>
                    <option value="기타">기타</option>
                </select>
            </div>

            <!-- 반려 시작 연도 -->
            <div class="mb-4">
                <label for="petStarted" class="form-label fw-semibold">반려 시작 연도</label>

                <input type="number"
                       id="petStarted"
                       th:field="*{petStarted}"
                       class="form-control rounded-3 py-2"
                       placeholder="예: 2020"
                       min="1900"
                       max="2099">
            </div>

            <!-- 회원가입 버튼 -->
            <button type="submit"
                    class="btn w-100 fw-semibold rounded-3 py-2 text-white shadow-sm"
                    style="background-color:#3a3f45; border:none;">
                회원가입
            </button>

            <!-- 로그인 이동 -->
            <div class="text-center mt-4 mb-4">
                이미 계정이 있으신가요?
                <a href="/login"
                   class="text-decoration-none fw-semibold"
                   style="color:#3a3f45;">
                    로그인
                </a>
            </div>

        </form>
    </div>
</div>

<!-- 회원가입 전용 JS -->
<script src="/js/signup.js"></script>

</body>
</html>
