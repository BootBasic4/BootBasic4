<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>신고 관리</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap"
          rel="stylesheet">
</head>

<body class="bg-light"
      style="font-family: 'Gowun Dodum', sans-serif;">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">관리자 페이지</h2>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="btn btn-link text-dark text-decoration-none p-0">
                로그아웃
            </button>
        </form>
    </div>

    <div class="mb-4 ms-auto" style="max-width: 120px;">
        <label for="reportFilter" class="form-label fw-bold">
            신고 목록
        </label>

        <select id="reportFilter"
                class="form-select"
                onchange="filterReports()">
            <option value="ALL">전체 신고</option>
            <option value="PENDING">처리 대기</option>
            <option value="DELETED">승인 완료</option>
            <option value="REJECTED">반려 목록</option>
        </select>
    </div>

    <div class="table-responsive bg-white rounded-4 shadow-sm overflow-hidden">

        <table class="table table-hover text-center align-middle mb-0">

            <thead class="table-light">
            <tr>
                <th class="py-3">번호</th>
                <th class="py-3">신고 대상</th>
                <th class="py-3">신고 사유</th>
                <th class="py-3">신고자</th>
                <th class="py-3">상태</th>
                <th class="py-3">처리</th>
            </tr>
            </thead>

            <tbody>

            <tr th:if="${#lists.isEmpty(reports)}">
                <td colspan="6" class="text-muted py-5">
                    신고 내역이 없습니다.
                </td>
            </tr>

            <tr th:each="report : ${reports}"
                th:attr="data-status=${report.status}">

                <td th:text="${report.reportId}"
                    th:classappend="${report.status != 'PENDING'} ? 'text-muted'"
                    class="py-3">
                    1
                </td>

                <td th:classappend="${report.status != 'PENDING'} ? 'text-muted'"
                    class="py-3">
                    <span th:if="${report.question != null}">게시글</span>
                    <span th:if="${report.answer != null}">답변</span>
                    <span th:if="${report.question == null and report.answer == null}">
                        삭제된 대상
                    </span>
                </td>

                <td class="text-start py-3"
                    th:classappend="${report.status != 'PENDING'} ? ' text-muted'">

                    <a th:if="${report.question != null}"
                       th:href="@{/questions/{questionId}(questionId=${report.question.id})}"
                       th:text="${report.reason}"
                       th:class="${report.status != 'PENDING'} ? 'text-decoration-none text-muted' : 'text-decoration-none text-dark'">
                        신고 사유
                    </a>

                    <a th:if="${report.answer != null}"
                       th:href="@{/questions/{questionId}(questionId=${report.answer.question.id})}"
                       th:text="${report.reason}"
                       th:class="${report.status != 'PENDING'} ? 'text-decoration-none text-muted' : 'text-decoration-none text-dark'">
                        신고 사유
                    </a>

                    <span th:if="${report.question == null and report.answer == null}"
                          th:text="${report.reason}">
                        신고 사유
                    </span>
                </td>

                <td th:text="${report.reporter.username}"
                    th:classappend="${report.status != 'PENDING'} ? 'text-muted'"
                    class="py-3">
                    신고자
                </td>

                <td th:classappend="${report.status != 'PENDING'} ? 'text-muted'"
                    class="py-3">
                    <span th:if="${report.status == 'PENDING'}">대기</span>
                    <span th:if="${report.status == 'DELETED'}">승인</span>
                    <span th:if="${report.status == 'REJECTED'}">반려</span>
                </td>

                <td class="py-3">
                    <div th:if="${report.status == 'PENDING'}"
                         class="d-flex justify-content-center gap-2">

                        <form th:action="@{/admin/reports/{reportId}/delete(reportId=${report.reportId})}"
                              method="post">
                            <button type="submit"
                                    class="btn btn-success btn-sm">
                                승인
                            </button>
                        </form>

                        <form th:action="@{/admin/reports/{reportId}/reject(reportId=${report.reportId})}"
                              method="post">
                            <button type="submit"
                                    class="btn btn-danger btn-sm">
                                반려
                            </button>
                        </form>
                    </div>

                    <span th:if="${report.status == 'DELETED'}"
                          class="text-muted">
                        승인 완료
                    </span>

                    <span th:if="${report.status == 'REJECTED'}"
                          class="text-muted">
                        처리 완료
                    </span>
                </td>

            </tr>

            </tbody>
        </table>
    </div>

</div>

<script>
    function filterReports() {
        const selectedStatus = document.getElementById("reportFilter").value;
        const rows = document.querySelectorAll("tr[data-status]");

        rows.forEach(row => {
            const rowStatus = row.getAttribute("data-status");

            row.style.display =
                selectedStatus === "ALL" || selectedStatus === rowStatus
                    ? ""
                    : "none";
        });
    }
</script>

</body>
</html>
