<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내가 쓴 답변</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"/>

</head>

<body class="bg-light">

<div class="container py-5" style="max-width:900px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">내 답변 목록</h2>

        <a href="/mypage"
           class="text-decoration-none text-dark fw-semibold fs-6">
            마이페이지
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-0">

            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr class="text-center">
                    <th style="width:80px;">번호</th>
                    <th>답변 내용</th>
                    <th style="width:160px;">작성일</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(answers)}">
                    <td colspan="3" class="text-center text-muted py-5">
                        작성한 답변이 없습니다.
                    </td>
                </tr>

                <tr th:each="answer : ${answers}">
                    <td class="text-center text-muted"
                        th:text="${answer.answerId}">
                        1
                    </td>

                    <td>
                        <a th:href="@{/questions/detail/{id}(id=${answer.question.id})}"
                           class="text-decoration-none text-dark fw-semibold"
                           th:text="${answer.content}">
                            답변 내용
                        </a>
                    </td>

                    <td class="text-center text-muted"
                        th:text="${#temporals.format(answer.createdAt, 'yyyy.MM.dd. HH:mm')}">
                        2026.05.15.
                    </td>

                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
