<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>내 답변 목록 - 멍냥위키</title>
</head>
<body>
<th:block layout:fragment="content">

    <div class="page-wrap" style="max-width:900px">
        <div class="mp-list-head">
            <h2 class="bd-title">내 답변 목록</h2>
            <a th:href="@{/mypage}" class="btn-l">마이페이지</a>
        </div>

        <div class="post-list">
            <div th:if="${#lists.isEmpty(answers)}" class="post-empty">
                작성한 답변이 없습니다.
            </div>
            <a th:each="answer : ${answers}"
               th:href="@{/questions/detail/{id}(id=${answer.question.id})}"
               class="post-row">
                <div class="post-mid">
                    <div class="post-title" th:text="${answer.content}">답변 내용</div>
                    <div class="post-meta">
                        <span th:text="${#temporals.format(answer.createdAt, 'yyyy.MM.dd. HH:mm')}">날짜</span>
                    </div>
                </div>
            </a>
        </div>
    </div>

</th:block>
</body>
</html>
