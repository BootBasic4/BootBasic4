<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>답변 수정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container" style="max-width: 900px; margin-top: 50px;">

    <h4 class="fw-bold mb-4">답변 수정</h4>

    <form th:action="@{/answers/edit/{answerId}(answerId=${answer.answerId})}"
          th:object="${answerFormDto}" method="post">

        <input type="hidden" name="questionId" th:value="${questionId}">

        <div class="mb-3">
            <textarea th:field="*{content}" class="form-control" rows="5"
                      placeholder="답변 내용을 입력하세요"></textarea>
            <div th:if="${#fields.hasErrors('content')}"
                 th:errors="*{content}" class="alert alert-danger mt-2"></div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/questions/detail/{questionId}(questionId=${questionId})}"
               class="btn btn-outline-secondary">취소</a>
            <button type="submit" class="btn btn-dark">수정 완료</button>
        </div>

    </form>

</div>
</body>
</html>
