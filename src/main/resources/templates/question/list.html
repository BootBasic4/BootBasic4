<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${category} + ' - 멍냥위키'">게시판</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-wrap">

        <h2 class="bd-title" th:text="${category}">게시판 이름</h2>

        <!-- 검색 폼 -->
        <form th:action="@{/questions/{category}(category=${category})}" method="get" class="bd-search">
            <select class="bd-sel" name="petType" onchange="this.form.submit()">
                <option value="ALL" th:selected="${petType == 'ALL'}">전체</option>
                <option th:each="pt : ${petTypes}"
                        th:if="${pt.name() != 'ALL'}"
                        th:value="${pt.name()}"
                        th:text="${pt.label}"
                        th:selected="${pt.name() == petType}">동물</option>
            </select>
            <select class="bd-sel" name="searchType">
                <option value="TITLE_CONTENT" th:selected="${searchType == 'TITLE_CONTENT'}">제목+내용</option>
                <option value="TITLE"         th:selected="${searchType == 'TITLE'}">제목</option>
                <option value="CONTENT"       th:selected="${searchType == 'CONTENT'}">내용</option>
            </select>
            <input type="text" class="bd-key" name="keyword"
                   th:value="${keyword}" placeholder="검색어를 입력하세요">
            <button type="submit" class="bd-btn">
                <i class="bi bi-search"></i> 검색
            </button>
            <input type="hidden" name="sort"      th:value="${sort}">
            <input type="hidden" name="direction" th:value="${direction}">
        </form>

        <!-- 툴바 -->
        <div class="bd-toolbar">
        <span class="bd-count">
            총 <strong th:text="${questions.totalElements}">0</strong>건
        </span>
            <div class="bd-actions">
                <div class="sort-group">
                    <a th:href="@{/questions/{category}(category=${category},keyword=${keyword},searchType=${searchType},petType=${petType},sort='createdAt',direction='desc',page=0)}"
                       class="sort-btn" th:classappend="${sort == 'createdAt' and direction == 'desc'} ? ' on'">최신순</a>
                    <a th:href="@{/questions/{category}(category=${category},keyword=${keyword},searchType=${searchType},petType=${petType},sort='createdAt',direction='asc',page=0)}"
                       class="sort-btn" th:classappend="${sort == 'createdAt' and direction == 'asc'} ? ' on'">오래된순</a>
                    <a th:href="@{/questions/{category}(category=${category},keyword=${keyword},searchType=${searchType},petType=${petType},sort='viewCount',direction='desc',page=0)}"
                       class="sort-btn" th:classappend="${sort == 'viewCount'} ? ' on'">조회순</a>
                </div>
                <a th:href="@{/questions/add(category=${category})}"
                   class="write-btn" sec:authorize="isAuthenticated()">
                    <i class="bi bi-pencil-square"></i> 글쓰기
                </a>
            </div>
        </div>

        <!-- 카드 리스트 -->
        <div class="post-list">
            <div th:if="${questions.content.isEmpty()}" class="post-empty">
                등록된 게시글이 없습니다.
            </div>
            <a th:each="q : ${questions.content}"
               th:href="@{/questions/detail/{id}(id=${q.id})}"
               class="post-row">
                <div class="post-thumb"></div>
                <!-- 이미지url 생성 후 해제
                <div class="post-thumb">
                    <img th:if="${q.imageUrl != null}"
                         th:src="${q.imageUrl}" th:alt="${q.title}"
                         onerror="this.parentNode.dataset.empty='true'"> -->

                <div class="post-mid">
                    <div class="post-top">
                        <span class="pet-tag" th:text="${q.petType != null ? q.petType.label : ''}"></span>
                        <span class="td-muted" th:text="'#' + ${q.boardSeq}"></span>
                    </div>
                    <div class="post-title post-title-link">
                        <span th:text="${q.title}">제목</span>
                        <span th:if="${q.answerCount > 0}" class="answer-count" th:text="'[' + ${q.answerCount} + ']'"></span>
                    </div>
                    <div class="post-meta">
                        <span th:text="${q.nickname}">작성자</span>
                        <span>조회 <span th:text="${q.viewCount}">0</span></span>
                        <span th:text="${#temporals.format(q.createdAt, 'MM-dd HH:mm')}">날짜</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- 페이지네이션 -->
        <nav th:if="${questions.totalPages > 1}" class="board-pagination">
            <ul>
                <li th:classappend="${questions.first} ? 'disabled'">
                    <a th:href="@{/questions/{category}(category=${category},page=${questions.number - 1},keyword=${keyword},searchType=${searchType},petType=${petType},sort=${sort},direction=${direction})}">&laquo;</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, questions.totalPages - 1)}"
                    th:if="${i >= questions.number - 4 and i <= questions.number + 4}"
                    th:classappend="${i == questions.number} ? 'on'">
                    <a th:href="@{/questions/{category}(category=${category},page=${i},keyword=${keyword},searchType=${searchType},petType=${petType},sort=${sort},direction=${direction})}"
                       th:text="${i + 1}">1</a>
                </li>
                <li th:classappend="${questions.last} ? 'disabled'">
                    <a th:href="@{/questions/{category}(category=${category},page=${questions.number + 1},keyword=${keyword},searchType=${searchType},petType=${petType},sort=${sort},direction=${direction})}">&raquo;</a>
                </li>
            </ul>
        </nav>

    </div>

    <!-- 검색어 하이라이트용 hidden span -->
    <span id="searchKeyword" th:attr="data-keyword=${keyword}" style="display:none"></span>

</th:block>

<th:block layout:fragment="scripts">
    <script>
        const keyword = document.getElementById('searchKeyword').dataset.keyword;
        if (keyword) {
            const pattern = new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            document.querySelectorAll('.post-title-link > span:first-child').forEach(el => {
                el.innerHTML = el.textContent.replace(pattern, match => `<mark>${match}</mark>`);
            });
        }
    </script>
</th:block>
</body>
</html>
