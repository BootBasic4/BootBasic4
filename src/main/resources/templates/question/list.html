<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시글 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h2 class="mb-4">게시글 목록</h2>

    <!-- 검색 폼 -->
    <form th:action="@{/questions}" method="get" class="row g-2 mb-3">
        <div class="col-md-3">
            <select class="form-select" name="category">
                <option value="" th:selected="${category == null}">게시판 전체</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.name()}"
                        th:text="${cat.name()}"
                        th:selected="${cat == category}">카테고리</option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select" name="petType">
                <option value="" th:selected="${petType == null}">동물 전체</option>
                <option th:each="pt : ${petTypes}"
                        th:value="${pt.name()}"
                        th:text="${pt.name()}"
                        th:selected="${pt == petType}">동물</option>
            </select>
        </div>
        <div class="col-md-5">
            <input type="text" class="form-control" name="keyword"
                   th:value="${keyword}" placeholder="제목 또는 내용 검색">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-search"></i> 검색
            </button>
        </div>
        <!-- 검색 시 정렬 상태 유지 -->
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="direction" th:value="${direction}">
    </form>

    <!-- 결과 요약 + 정렬 + 글쓰기 버튼 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-muted small">
            총 <strong th:text="${questions.totalElements}">0</strong>건
        </span>
        <div class="d-flex gap-2 align-items-center">
            <div class="btn-group btn-group-sm">
                <a th:href="@{/questions(keyword=${keyword},category=${category},petType=${petType},sort='createdAt',direction='desc',page=0)}"
                   class="btn btn-outline-secondary"
                   th:classappend="${sort == 'createdAt' and direction == 'desc'} ? ' active'">최신순</a>
                <a th:href="@{/questions(keyword=${keyword},category=${category},petType=${petType},sort='createdAt',direction='asc',page=0)}"
                   class="btn btn-outline-secondary"
                   th:classappend="${sort == 'createdAt' and direction == 'asc'} ? ' active'">오래된순</a>
                <a th:href="@{/questions(keyword=${keyword},category=${category},petType=${petType},sort='viewCount',direction='desc',page=0)}"
                   class="btn btn-outline-secondary"
                   th:classappend="${sort == 'viewCount'} ? ' active'">조회순</a>
            </div>
            <a th:href="@{/questions/new}" class="btn btn-sm btn-success">
                <i class="bi bi-pencil-square"></i> 글쓰기
            </a>
        </div>
    </div>

    <!-- 목록 테이블 -->
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th style="width:60px">번호</th>
                <th style="width:80px">게시판</th>
                <th>제목</th>
                <th style="width:80px">동물</th>
                <th style="width:55px">조회</th>
                <th style="width:110px">작성일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${questions.content.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-5">게시글이 없습니다.</td>
            </tr>
            <tr th:each="question : ${questions.content}">
                <td class="text-muted small" th:text="${question.id}"></td>
                <td>
                    <span class="badge rounded-pill bg-secondary"
                          th:text="${question.category.name()}">게시판</span>
                </td>
                <td>
                    <a th:href="@{/questions/detail/{id}(id=${question.id})}"
                       th:text="${question.title}"
                       class="text-decoration-none text-dark fw-semibold">제목</a>
                </td>
                <td>
                    <span class="badge bg-light text-dark border"
                          th:text="${question.petType.name()}">동물</span>
                </td>
                <td class="small text-muted" th:text="${question.viewCount}"></td>
                <td class="small text-muted"
                    th:text="${#temporals.format(question.createdAt, 'MM-dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <nav th:if="${questions.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${questions.first} ? ' disabled'">
                <a class="page-link"
                   th:href="@{/questions(page=${questions.number - 1},keyword=${keyword},category=${category},petType=${petType},sort=${sort},direction=${direction})}">&laquo;</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, questions.totalPages - 1)}"
                th:if="${i >= questions.number - 4 and i <= questions.number + 4}"
                class="page-item"
                th:classappend="${i == questions.number} ? ' active'">
                <a class="page-link"
                   th:href="@{/questions(page=${i},keyword=${keyword},category=${category},petType=${petType},sort=${sort},direction=${direction})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${questions.last} ? ' disabled'">
                <a class="page-link"
                   th:href="@{/questions(page=${questions.number + 1},keyword=${keyword},category=${category},petType=${petType},sort=${sort},direction=${direction})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
