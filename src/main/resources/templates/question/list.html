<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>커뮤니티 - [[${category}]]</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* 레퍼런스 스타일 반영 */
        .sidebar { border-right: 1px solid #eee; min-height: 100vh; }
        .sidebar a { color: #555; text-decoration: none; padding: 10px 15px; display: block; }
        .sidebar a:hover { background-color: #f8f9fa; color: #000; }
        .sidebar a.active { color: #4e73df; font-weight: bold; }
        .post-table thead { border-bottom: 2px solid #333; }
        .search-container { background-color: #f8f9fa; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar bg-light">
            <div class="position-sticky pt-4">
                <h2 class="px-3 mb-3 fw-bold">멍냥위키</h2>
                <a th:href="@{/questions/QUESTION}" th:classappend="${category == 'QUESTION'} ? 'active'">질문게시판</a>
                <a th:href="@{/questions/ADOPTION}" th:classappend="${category == 'ADOPTION'} ? 'active'">분양게시판</a>
                <a th:href="@{/questions/TIP}" th:classappend="${category == 'TIP'} ? 'active'">꿀팁게시판</a>
                <a th:href="@{/questions/SHARE}" th:classappend="${category == 'SHARE'} ? 'active'">나눔게시판</a>
                <a th:href="@{/questions/FREE}" th:classappend="${category == 'FREE'} ? 'active'">자유게시판</a>
            </div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4">
            <div class="pt-4 pb-2 mb-3 border-bottom">
                <h2 class="h3 fw-bold" th:text="${category}">게시판 이름</h2>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="filter-group">
                    <select class="form-select" onchange="location.href=this.value">
                        <option th:value="@{/questions/{cat}/ALL(cat=${category})}"
                                th:selected="${petType == 'ALL' || petType == null}">모두 보기</option>
                        <option th:value="@{/questions/{cat}/DOG(cat=${category})}"
                                th:selected="${petType == 'DOG'}">강아지</option>
                        <option th:value="@{/questions/{cat}/CAT(cat=${category})}"
                                th:selected="${petType == 'CAT'}">고양이</option>
                    </select>
                </div>
                <a th:href="@{/questions/add(category=${category})}" class="btn btn-primary">글쓰기</a>
            </div>

            <table class="table post-table table-hover">
                <thead>
                <tr>
                    <th style="width: 60%">글 제목</th>
                    <th style="width: 20%" class="text-center">작성자</th>
                    <th style="width: 20%" class="text-center">작성일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${questions.isEmpty()}">
                    <td colspan="3" class="text-center py-5 text-muted">등록된 게시글이 없습니다.</td>
                </tr>
                <tr th:each="q : ${questions}">
                    <td>
                        <a th:href="@{/questions/detail/{id}(id=${q.id})}"
                           th:text="${q.title}" class="text-decoration-none text-dark">제목</a>
                    </td>
                    <td class="text-center text-muted" th:text="${q.nickname}">작성자</td>
                    <td class="text-center text-muted" th:text="${#temporals.format(q.createdAt, 'yyyy.MM.dd')}">2026.05.17</td>
                </tr>
                </tbody>
            </table>

            <div class="my-4 text-center text-muted small">
            </div>

            <div class="search-container mt-5">
                <form th:action="@{/questions/search}" method="get" class="row justify-content-center g-2">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" name="keyword" class="form-control border-start-0" placeholder="관심 있는 내용을 검색해 보세요!">
                            <button type="submit" class="btn btn-dark">검색</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
