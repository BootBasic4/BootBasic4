<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${questionId == null} ? '질문 등록 - 멍냥위키' : '질문 수정 - 멍냥위키'">게시글 폼</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-wrap" style="max-width:800px">
        <div class="form-box">

            <h3 class="fm-title"
                th:text="${questionId == null} ? '새로운 질문 등록' : '질문 수정하기'">질문 폼</h3>

            <form th:action="${questionId == null} ? '/questions/add' : '/questions/edit/' + ${questionId}"
                  th:object="${dto}" method="post">

                <!-- 카테고리 -->
                <div class="fm-group">
                    <label class="fm-label">게시판 카테고리</label>

                    <!-- 등록 시: 선택 가능 -->
                    <select th:if="${questionId == null}" th:field="*{category}" class="fm-control">
                        <option value="QUESTION">질문게시판</option>
                        <option value="ADOPTION">분양게시판</option>
                        <option value="TIP">꿀팁게시판</option>
                        <option value="SHARE">나눔게시판</option>
                        <option value="FREE">자유게시판</option>
                    </select>

                    <!-- 수정 시: 변경 불가 -->
                    <div th:unless="${questionId == null}">
                        <select class="fm-control" style="background:#f5f5f5;color:#999" disabled>
                            <option value="QUESTION" th:selected="${#strings.toString(dto.category) == 'QUESTION'}">질문게시판</option>
                            <option value="ADOPTION" th:selected="${#strings.toString(dto.category) == 'ADOPTION'}">분양게시판</option>
                            <option value="TIP"      th:selected="${#strings.toString(dto.category) == 'TIP'}">꿀팁게시판</option>
                            <option value="SHARE"    th:selected="${#strings.toString(dto.category) == 'SHARE'}">나눔게시판</option>
                            <option value="FREE"     th:selected="${#strings.toString(dto.category) == 'FREE'}">자유게시판</option>
                        </select>
                        <input type="hidden" name="category" th:value="${dto.category}">
                    </div>

                    <div class="fm-error" th:if="${#fields.hasErrors('category')}"
                         th:errors="*{category}"></div>
                </div>

                <!-- 반려동물 종류 -->
                <div class="fm-group">
                    <label class="fm-label">반려동물 종류</label>
                    <div class="fm-radio">
                        <label><input type="radio" th:field="*{petType}" value="DOG"> 강아지</label>
                        <label><input type="radio" th:field="*{petType}" value="CAT"> 고양이</label>
                    </div>
                    <div class="fm-error" th:if="${#fields.hasErrors('petType')}"
                         th:errors="*{petType}"></div>
                </div>

                <!-- 제목 -->
                <div class="fm-group">
                    <label class="fm-label">제목</label>
                    <input type="text" th:field="*{title}" class="fm-control"
                           placeholder="제목을 입력해 주세요.">
                    <div class="fm-error" th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"></div>
                </div>

                <!-- 내용 -->
                <div class="fm-group">
                    <label class="fm-label">내용</label>
                    <textarea th:field="*{content}" class="fm-control"
                              rows="10" placeholder="내용을 입력해 주세요."></textarea>
                    <div class="fm-error" th:if="${#fields.hasErrors('content')}"
                         th:errors="*{content}"></div>
                </div>

                <!-- 이미지 URL -->
                <div class="fm-group">
                    <label class="fm-label">이미지 주소 (선택)</label>
                    <input type="text" th:field="*{imageUrl}" class="fm-control"
                           placeholder="이미지 URL을 입력하세요.">
                </div>

                <!-- 버튼 -->
                <div class="fm-buttons">
                    <a href="javascript:history.back();" class="btn-l">취소</a>
                    <button type="submit" class="btn-fill">저장</button>
                </div>
            </form>

        </div>
    </div>
</th:block>
</body>
</html>
