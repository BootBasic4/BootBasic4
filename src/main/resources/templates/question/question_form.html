<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${questionId == null} ? '질문 등록' : '질문 수정'">게시글 폼</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .form-container { max-width: 800px; margin-top: 50px; margin-bottom: 50px; }
        .error-msg { color: #dc3545; font-size: 0.85rem; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container form-container shadow-sm p-4 bg-white rounded">
    <h3 class="fw-bold mb-4 border-bottom pb-3"
        th:text="${questionId == null} ? '새로운 질문 등록' : '질문 수정하기'">질문 FORM</h3>

    <form th:action="${questionId == null} ? @{/questions/add} : @{/questions/edit/{question_id}(question_id=${questionId})}"
          th:object="${dto}" method="post">

        <div class="mb-3">
            <label class="form-label fw-bold">게시판 카테고리</label>

            <select th:if="${questionId == null}" th:field="*{category}" class="form-select">
                <option value="QUESTION">질문게시판</option>
                <option value="ADOPTION">분양게시판</option>
                <option value="TIP">꿀팁게시판</option>
                <option value="SHARE">나눔게시판</option>
                <option value="FREE">자유게시판</option>
            </select>

            <div th:unless="${questionId == null}">
                <select class="form-select bg-light text-muted" disabled>
                    <option value="QUESTION" th:selected="${#strings.toString(dto.category) == 'QUESTION'}">질문게시판</option>
                    <option value="ADOPTION" th:selected="${#strings.toString(dto.category) == 'ADOPTION'}">분양게시판</option>
                    <option value="TIP"      th:selected="${#strings.toString(dto.category) == 'TIP'}">꿀팁게시판</option>
                    <option value="SHARE"    th:selected="${#strings.toString(dto.category) == 'SHARE'}">나눔게시판</option>
                    <option value="FREE"     th:selected="${#strings.toString(dto.category) == 'FREE'}">자유게시판</option>
                </select>

                <input type="hidden" name="category" th:value="${dto.category}">
            </div>

            <div class="error-msg" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>


        <div class="mb-3">
            <label class="form-label fw-bold">반려동물 종류</label>
            <div class="d-flex gap-3">
                <div class="form-check">
                    <input class="form-check-input" type="radio" th:field="*{petType}" value="DOG" id="petDog">
                    <label class="form-check-label" for="petDog">강아지</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" th:field="*{petType}" value="CAT" id="petCat">
                    <label class="form-check-label" for="petCat">고양이</label>
                </div>
            </div>
            <div class="error-msg" th:if="${#fields.hasErrors('petType')}" th:errors="*{petType}"></div>
        </div>

        <div class="mb-3">
            <label for="title" class="form-label fw-bold">제목</label>
            <input type="text" th:field="*{title}" class="form-control" placeholder="제목을 입력해 주세요.">
            <div class="error-msg" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
            <label for="content" class="form-label fw-bold">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10" placeholder="내용을 입력해 주세요."></textarea>
            <div class="error-msg" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
        </div>

        <div class="mb-4">
            <label for="imageUrl" class="form-label fw-bold">이미지 주소 (선택)</label>
            <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="이미지 URL을 입력하세요.">
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a href="javascript:history.back();" class="btn btn-light border px-4">취소</a>
            <button type="submit" class="btn btn-primary px-4">저장</button>
        </div>
    </form>
</div>
</body>
</html>
