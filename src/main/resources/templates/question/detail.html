<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="'상세보기 - ' + ${question.title}">상세보기</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-wrap" style="max-width:900px">

        <!-- 신고 처리중 알림 -->
        <div th:if="${isReported}"
             style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:#795548">
            ⚠ 신고 처리중인 게시글입니다. 관리자가 확인 중입니다.
        </div>

        <!-- 글 헤더 -->
        <div class="dt-header">
            <div class="dt-cat" th:text="${question.categoryLabel}">게시판</div>
            <h2 class="dt-title" th:text="${question.title}">제목</h2>
            <div class="dt-meta">
                <div class="dt-author">
                    <div class="dt-avatar">프로필<br>사진</div>
                    <span th:text="${question.nickname}">작성자</span>
                </div>
                <div class="dt-counts">
                    <span><i class="bi bi-chat-dots"></i> <span th:text="${question.commentCount}">0</span></span>
                    <span><i class="bi bi-eye"></i> <span th:text="${question.viewCount}">0</span></span>
                    <span th:text="${#temporals.format(question.createdAt, 'yyyy.MM.dd. HH:mm')}">날짜</span>
                </div>
            </div>
        </div>

        <!-- 본문 -->
        <div class="dt-body">
            <div th:if="${question.imageUrl}" class="dt-image">
                <img th:src="${question.imageUrl}" th:alt="${question.title}">
            </div>
            <p class="dt-content" th:text="${question.content}">본문 내용</p>
        </div>

        <!-- 버튼 -->
        <div class="dt-buttons">
            <a th:href="@{/questions/{cat}(cat=${question.category})}" class="btn-l">목록으로</a>

            <th:block th:if="${#authentication != null and question.username == #authentication.name}">
                <a th:href="@{/questions/edit/{id}(id=${question.id})}" class="btn-l">수정</a>
                <form th:action="@{/questions/delete/{id}(id=${question.id})}" method="post"
                      style="display:inline" onsubmit="return confirm('정말 삭제하시겠습니까?')">
                    <input type="hidden" name="category" th:value="${question.category}">
                    <button type="submit" class="btn-danger">삭제</button>
                </form>
            </th:block>

            <!-- 신고 버튼 -->
            <button th:if="${!isReported and #authentication != null and question.username != #authentication.name}"
                    sec:authorize="isAuthenticated()"
                    type="button"
                    class="btn-l" style="color:#e74c3c;border-color:#f5c6c2"
                    data-bs-toggle="modal"
                    data-bs-target="#questionReportModal">
                신고
            </button>
        </div>

        <!-- 게시글 신고 모달 -->
        <div sec:authorize="isAuthenticated()"
             class="modal fade" id="questionReportModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered" style="max-width:400px">
                <div class="modal-content mp-modal">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold" style="color:#e74c3c">게시글 신고</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/questions/{id}/report(id=${question.id})}" method="post">
                        <div class="modal-body">
                        <textarea name="reason" class="fm-control" rows="4"
                                  placeholder="신고 사유를 입력해주세요." required></textarea>
                        </div>
                        <div class="modal-footer border-0">
                            <button type="button" class="btn-text-dark" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn-text-danger">신고 완료</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 답변 영역 -->
        <div class="cmt-section">
            <h5 class="cmt-head">
                답변 <span th:text="${#lists.size(answers)}">0</span>
            </h5>

            <!-- 답변 목록 -->
            <div class="cmt-list">
                <div th:if="${#lists.isEmpty(answers)}" class="cmt-empty">
                    아직 등록된 답변이 없습니다.
                </div>
                <div th:each="answer : ${answers}" class="cmt-item">
                    <div class="cmt-item-head">
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                            <span class="cmt-item-author" th:text="${answer.member.nickname}">작성자</span>
                            <span class="td-muted"
                                  th:if="${answer.member.petType != null and answer.member.petStarted != null}"
                                  th:text="${answer.member.petType + '와 ' + (2026 - answer.member.petStarted) + '년째 함께하는 중'}"
                                  style="font-size:11px"></span>
                            <!-- 신고 처리중 배지 -->
                            <span th:if="${reportedAnswerIds.contains(answer.answerId)}"
                                  class="report-badge">
                            신고 처리중
                        </span>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px">
                        <span class="cmt-item-date"
                              th:text="${#temporals.format(answer.createdAt, 'yyyy.MM.dd. HH:mm')}">날짜</span>
                            <span class="cmt-item-date"
                                  th:if="${answer.updatedAt != null}"
                                  th:text="${'(수정: ' + #temporals.format(answer.updatedAt, 'yyyy.MM.dd. HH:mm') + ')'}"></span>
                        </div>
                    </div>
                    <p class="cmt-item-body" th:text="${answer.content}">답변 내용</p>

                    <!-- 수정/삭제 (본인 + 신고처리중 아닐 때) -->
                    <div class="cmt-item-actions"
                         th:if="${#authentication != null
                             and answer.member.username == #authentication.name
                             and !reportedAnswerIds.contains(answer.answerId)}">
                        <a th:href="@{/answers/edit/{id}(id=${answer.answerId}, questionId=${question.id})}"
                           class="btn-l" style="font-size:12px;padding:4px 10px">수정</a>
                        <form th:action="@{/answers/delete/{id}(id=${answer.answerId})}" method="post"
                              style="display:inline" onsubmit="return confirm('정말 삭제하시겠습니까?')">
                            <input type="hidden" name="questionId" th:value="${question.id}">
                            <button type="submit" class="btn-danger"
                                    style="font-size:12px;padding:4px 10px">삭제</button>
                        </form>
                    </div>

                    <!-- 신고 버튼 (타인 + 신고처리중 아닐 때) -->
                    <button th:if="${!reportedAnswerIds.contains(answer.answerId)
                                and #authentication != null
                                and answer.member.username != #authentication.name}"
                            sec:authorize="isAuthenticated()"
                            type="button"
                            class="btn-l" style="font-size:12px;padding:4px 10px;color:#e74c3c;border-color:#f5c6c2;margin-top:6px"
                            data-bs-toggle="modal"
                            th:attr="data-bs-target='#answerReportModal' + ${answer.answerId}">
                        신고
                    </button>

                    <!-- 답변 신고 모달 -->
                    <div sec:authorize="isAuthenticated()"
                         class="modal fade"
                         th:id="'answerReportModal' + ${answer.answerId}"
                         tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered" style="max-width:400px">
                            <div class="modal-content mp-modal">
                                <div class="modal-header border-0">
                                    <h5 class="modal-title fw-bold" style="color:#e74c3c">답변 신고</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <form th:action="@{/answers/{id}/report(id=${answer.answerId})}" method="post">
                                    <div class="modal-body">
                                    <textarea name="reason" class="fm-control" rows="4"
                                              placeholder="신고 사유를 입력해주세요." required></textarea>
                                        <input type="hidden" name="questionId" th:value="${question.id}">
                                    </div>
                                    <div class="modal-footer border-0">
                                        <button type="button" class="btn-text-dark" data-bs-dismiss="modal">취소</button>
                                        <button type="submit" class="btn-text-danger">신고 완료</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 답변 등록 폼 -->
            <div sec:authorize="isAuthenticated()" class="cmt-form">
                <form th:action="@{/answers/{questionId}(questionId=${question.id})}"
                      th:object="${answerFormDto}" method="post">
                <textarea th:field="*{content}" rows="3"
                          placeholder="답변을 남겨보세요" required></textarea>
                    <div class="fm-error"
                         th:if="${#fields.hasErrors('content')}"
                         th:errors="*{content}"></div>
                    <div class="cmt-submit">
                        <button type="submit">등록</button>
                    </div>
                </form>
            </div>

            <div sec:authorize="isAnonymous()" class="cmt-login">
                답변을 작성하려면 <a th:href="@{/login}">로그인</a>이 필요합니다.
            </div>
        </div>

    </div>
</th:block>
</body>
</html>
