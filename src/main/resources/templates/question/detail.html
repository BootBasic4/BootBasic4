<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상세보기 - [[${question.title}]]</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .detail-container {
            max-width: 900px;
            margin-top: 50px;
        }

        .post-header {
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .post-meta {
            font-size: 0.9rem;
            color: #888;
        }

        .post-content {
            min-height: 300px;
            line-height: 1.6;
            position: relative;
        }

        .post-date {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 0.85rem;
            color: #aaa;
        }

        .comment-section {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 50px;
        }

        .comment-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .comment-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>
<div class="container detail-container">
    <div th:if="${isReported}" class="alert alert-warning">
        신고 처리중인 게시글입니다. 관리자가 확인 중입니다.
    </div>
    <div class="post-header">
        <h2 class="fw-bold mb-3" th:text="${question.title}">게시글 제목</h2>
        <div class="post-meta d-flex gap-3">
            <span><i class="bi bi-person"></i> [[${question.nickname}]]</span>
            <span><i class="bi bi-chat-dots"></i> 댓글 [[${question.commentCount}]]</span>
            <span><i class="bi bi-eye"></i> 조회 [[${question.viewCount}]]</span>
        </div>
    </div>

    <div class="post-content">
        <div class="post-date">
            <span th:text="${#temporals.format(question.createdAt, 'yyyy.MM.dd. HH:mm')}">2026.05.11. 23:04</span>
        </div>

        <div class="mt-4">
            <div th:if="${question.imageUrl}" class="mb-4">
                <img th:src="${question.imageUrl}" class="img-fluid rounded">
            </div>
            <p th:text="${question.content}" style="white-space: pre-wrap;">게시글 본문 내용</p>
        </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-5">
        <a th:href="@{/questions/{cat}(cat=${question.category})}" class="btn btn-outline-secondary">목록으로</a>
        <a th:if="${#authentication.name == question.username}"
           th:href="@{/questions/edit/{id}(id=${question.id})}" class="btn btn-light border">수정</a>
        <form th:if="${#authentication.name == question.username}"
              th:action="@{/questions/delete/{id}(id=${question.id})}" method="post">
            <input type="hidden" name="category" th:value="${question.category}">
            <button type="submit" class="btn btn-danger" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
        </form>
        <button th:if="${!isReported and #authentication.name != question.username}"
                sec:authorize="isAuthenticated()"
                type="button"
                class="btn btn-outline-danger"
                data-bs-toggle="modal"
                data-bs-target="#questionReportModal">
            신고
        </button>

        <!-- 신고 모달 창-->
        <div sec:authorize="isAuthenticated()"
             class="modal fade"
             id="questionReportModal"
             tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/questions/{questionId}/report(questionId=${question.id})}"
                          method="post">
                        <div class="modal-header">
                            <h5 class="modal-title">게시글 신고</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                    <textarea name="reason"
                              class="form-control"
                              rows="4"
                              placeholder="신고 사유를 입력해주세요."
                              required></textarea>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn btn-danger">신고 완료</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- // 답변 관련 코드 -->
    <div class="comment-section">
        <h5 class="fw-bold mb-4">댓글 <span class="text-primary">0</span></h5>

        <div class="comment-list">
            <div th:if="${#lists.isEmpty(answers)}">
                <p class="text-center text-muted py-3">아직 등록된 답변이 없습니다.</p>
            </div>
            <div th:each="answer : ${answers}" class="comment-item">
                <div class="d-flex justify-content-between">
                    <div>
                        <span class="fw-bold" th:text="${answer.member.nickname}">작성자</span>
                        <!-- // 반려동물 경력 표시 추가함-->
                        <span class="text-muted ms-2" style="font-size: 0.85rem;"
                              th:if="${answer.member.petType != null and answer.member.petStarted != null}"
                              th:text="${answer.member.petType + '와 ' + (2026 - answer.member.petStarted) + '년째 함께하는 중'}">
                        </span>
                    </div>
                        <div>
                        <span class="text-muted" style="font-size: 0.85rem;"
                              th:text="${#temporals.format(answer.createdAt, 'yyyy.MM.dd. HH:mm')}">작성일</span>
                        <span class="text-muted" style="font-size: 0.85rem;"
                              th:if="${answer.updatedAt != null}"
                              th:text="${' (수정: ' + #temporals.format(answer.updatedAt, 'yyyy.MM.dd. HH:mm') + ')'}">수정일</span>
                    </div>
                </div>

                <p class="mt-2" th:text="${answer.content}">답변 내용</p>
                <div class="d-flex gap-2" th:if="${#authentication.name == answer.member.username}">
                    <a th:href="@{/answers/edit/{answerId}(answerId=${answer.answerId}, questionId=${question.id})}"
                       class="btn btn-sm btn-outline-secondary">수정</a>
                    <form th:action="@{/answers/delete/{answerId}(answerId=${answer.answerId})}" method="post">
                        <input type="hidden" name="questionId" th:value="${question.id}">
                        <button type="submit" class="btn btn-sm btn-danger"
                                onclick="return confirm('정말 삭제하시겠습니까?')">삭제
                        </button>
                    </form>
                </div>
                <!-- 로그인한 사용자만 댓글 신고 가능 -->
                <button th:if="${!reportedAnswerIds.contains(answer.answerId)
                                and #authentication.name != answer.member.username}"
                        sec:authorize="isAuthenticated()"
                        type="button"
                        class="btn btn-sm btn-outline-danger"
                        data-bs-toggle="modal"
                        th:attr="data-bs-target='#answerReportModal' + ${answer.answerId}">
                    신고
                </button>
                <span th:if="${reportedAnswerIds.contains(answer.answerId)}"
                      class="badge bg-warning text-dark align-self-center">
                        신고 처리중
                    </span>
                <!-- 댓글 신고 모달 -->
                <div sec:authorize="isAuthenticated()"
                     class="modal fade"
                     th:id="'answerReportModal' + ${answer.answerId}"
                     tabindex="-1">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">

                            <form th:action="@{/answers/{answerId}/report(answerId=${answer.answerId})}"
                                  method="post">

                                <div class="modal-header">
                                    <h5 class="modal-title">댓글 신고</h5>
                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal"></button>
                                </div>

                                <div class="modal-body">
                                    <textarea name="reason"
                                              class="form-control"
                                              rows="4"
                                              placeholder="신고 사유를 입력해주세요."
                                              required></textarea>

                                    <input type="hidden"
                                           name="questionId"
                                           th:value="${question.id}">
                                </div>

                                <div class="modal-footer">
                                    <button type="button"
                                            class="btn btn-secondary"
                                            data-bs-dismiss="modal">
                                        취소
                                    </button>

                                    <button type="submit"
                                            class="btn btn-danger">
                                        신고 완료
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <form th:action="@{/answers/{questionId}(questionId=${question.id})}"
                  th:object="${answerFormDto}" method="post">
        <textarea th:field="*{content}" class="form-control mb-2" rows="3"
                  placeholder="답변을 남겨보세요"></textarea>
                <div th:if="${#fields.hasErrors('content')}"
                     th:errors="*{content}" class="alert alert-danger mb-2"></div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-dark">등록</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
