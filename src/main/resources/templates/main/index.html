<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>멍냥위키</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"/>

</head>

<body class="bg-light">

<!-- 상단 네비게이션 -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <div class="container">

        <!-- 로고 -->
        <a class="navbar-brand fw-bold" href="/">
            멍냥위키
        </a>

        <!-- 우측 메뉴 -->
        <div class="d-flex align-items-center gap-2">

            <!-- 로그인 안한 상태 -->
            <div sec:authorize="isAnonymous()"
                 class="d-flex gap-2">

                <!-- 로그인 -->
                <a href="/login"
                   class="btn btn-dark fw-semibold rounded-3 shadow-sm text-white
                          d-flex align-items-center justify-content-center"
                   style="
                        width:95px;
                        height:42px;
                    ">
                    로그인
                </a>

                <!-- 회원가입 -->
                <a href="/signup"
                   class="btn btn-light fw-semibold rounded-3 shadow-sm
                          d-flex align-items-center justify-content-center"
                   style="
                        width:95px;
                        height:42px;
                        border:1px solid #dee2e6;
                ">
                    회원가입
                </a>

            </div>

            <!-- 로그인 한 상태 -->
            <div sec:authorize="isAuthenticated()"
                 class="d-flex align-items-center gap-2">

                <!-- 마이페이지 -->
                <a href="/mypage"
                   class="btn btn-light fw-semibold rounded-3 shadow-sm
                          d-flex align-items-center justify-content-center"
                   style="
                        border:1px solid #dee2e6;
                        width:110px;
                        height:42px;
                    ">
                   마이페이지
                </a>

                <!-- 로그아웃 -->
                <form th:action="@{/logout}"
                      method="post">

                    <button type="submit"
                            class="btn btn-dark fw-semibold rounded-3 shadow-sm text-white
                                   d-flex align-items-center justify-content-center"
                            style="
                                width:110px;
                                height:42px;
                            ">
                        로그아웃
                    </button>

                </form>

            </div>

        </div>

</nav>

</body>
</html>
