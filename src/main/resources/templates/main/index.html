<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>멍냥위키</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"/>

    <!-- 글씨체 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap"
          rel="stylesheet">
</head>

<body class="bg-light"
      style="font-family: 'Gowun Dodum', sans-serif;">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            멍냥위키
        </a>

        <div class="d-flex gap-2">

            <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                <a href="/login"
                   class="btn fw-semibold rounded-3 px-4 py-2 shadow-sm text-white"
                   style="background-color:#3a3f45; border:none;">
                    로그인
                </a>
            </div>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post">
                <button type="submit"
                        class="btn btn-outline-dark">
                    로그아웃
                </button>
            </form>

        </div>

    </div>
</nav>

</body>
</html>
